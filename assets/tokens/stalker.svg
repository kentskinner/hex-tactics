    <path d="M22 70 C14 50 22 30 36 24 C30 38 30 52 36 62 Z M78 70 C86 50 78 30 64 24 C70 38 70 52 64 62 Z" fill="#f3ead2"/>
    <path d="M50 20 C62 30 66 48 60 66 L50 82 L40 66 C34 48 38 30 50 20 Z" fill="#6b4c7c"/>
    <path d="M44 50 L48 56 L42 58 Z M56 50 L52 56 L58 58 Z" fill="#ffd34a" stroke-width="1"/>
