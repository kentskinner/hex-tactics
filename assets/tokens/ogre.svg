<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100">
  <!-- Drawn in the Blue team colours (#5b9bf0, #2f6fd6, #173763); the game recolours them for Red. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#d9a441"/><stop offset="1" stop-color="#7a5318"/>
    </linearGradient>
    <radialGradient id="field" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#5b9bf0"/><stop offset=".6" stop-color="#2f6fd6"/><stop offset="1" stop-color="#173763"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d19a5a"/><stop offset=".5" stop-color="#a86f36"/><stop offset="1" stop-color="#6e431c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8b96a2"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48.5" fill="#2e210c"/>
  <circle cx="50" cy="50" r="47" fill="url(#rim)"/>
  <circle cx="50" cy="50" r="41.5" fill="#2e210c"/>
  <circle cx="50" cy="50" r="40.5" fill="url(#field)"/>
  <path d="M17 45 A34 34 0 0 1 60 18" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2.4" stroke-linecap="round"/>
