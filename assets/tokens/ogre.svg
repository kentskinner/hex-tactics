    <path d="M40 22 L32 13 L44 17 Z M60 22 L68 13 L56 17 Z M37 37 L27 33 L37 30 Z M63 37 L73 33 L63 30 Z M38 50 L29 50 L38 44 Z M62 50 L71 50 L62 44 Z" fill="url(#steel)"/>
    <path d="M50 12 C60 12 64 20 64 30 C64 44 58 52 55.5 66 L54 84 H46 L44.5 66 C42 52 36 44 36 30 C36 20 40 12 50 12 Z" fill="url(#wood)"/>
    <path d="M44 25 C46 38 46 50 47.5 64 M55 22 C54 36 54 50 52.5 64" fill="none" stroke-width="1.1" stroke-opacity=".5"/>
    <path d="M45.5 70 H54.5 M45.8 76 H54.2" stroke="#e8d9b0" stroke-width="2.4"/>
    <circle cx="50" cy="87" r="4.4" fill="#e0b24a"/>
