    <path d="M30 66 L58 44" fill="none" stroke-width="3"/>
    <path d="M70 60 L28 30 L25 34 L67 64 Z" fill="#c09050"/>
    <path d="M20 28 C20 22 30 20 32 27 C33 33 23 36 20 28 Z" fill="#6c4a2a"/>
    <circle cx="26" cy="26" r="5.500" fill="#c8c8c0"/>
    <circle cx="34" cy="74" r="7" fill="#5a3a1c"/><circle cx="66" cy="74" r="7" fill="#5a3a1c"/>
    <circle cx="34" cy="74" r="2" fill="#c09050"/><circle cx="66" cy="74" r="2" fill="#c09050"/>
