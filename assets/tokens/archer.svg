<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100">
  <!-- Drawn in the Blue team colours (#5b9bf0, #2f6fd6, #173763); the game recolours them for Red. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#d9a441"/><stop offset="1" stop-color="#7a5318"/>
    </linearGradient>
    <radialGradient id="field" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#5b9bf0"/><stop offset=".6" stop-color="#2f6fd6"/><stop offset="1" stop-color="#173763"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa5b1"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48.5" fill="#2e210c"/>
  <circle cx="50" cy="50" r="47" fill="url(#rim)"/>
  <circle cx="50" cy="50" r="40" fill="#2e210c"/>
  <circle cx="50" cy="50" r="38.5" fill="url(#field)"/>
  <path d="M19 45 A32 32 0 0 1 60 20" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
  <g transform="rotate(-32 50 50) translate(-3 0)" stroke-linecap="round" stroke-linejoin="round">
    <!-- drawn string -->
    <path d="M40 19 L27 50 L40 81" fill="none" stroke="#fffaf0" stroke-width="1.8"/>
    <!-- bow -->
    <path d="M40 19 C72 30 72 70 40 81" fill="none" stroke="#1b1b1b" stroke-width="9.5"/>
    <path d="M40 19 C72 30 72 70 40 81" fill="none" stroke="#c98b45" stroke-width="6"/>
    <path d="M42 21.5 C68 32 68 68 42 78.5" fill="none" stroke="#f0c98a" stroke-width="1.6" stroke-opacity=".8"/>
    <path d="M60 43 V57" stroke="#5a3418" stroke-width="7.5"/>
    <!-- arrow -->
    <path d="M27 50 H80" stroke="#1b1b1b" stroke-width="5.2"/>
    <path d="M27 50 H80" stroke="#fffaf0" stroke-width="2.6"/>
    <path d="M77 42.5 L92 50 L77 57.5 L80.5 50 Z" fill="url(#steel)" stroke="#1b1b1b" stroke-width="1.6"/>
    <path d="M18 43.5 H27 L32 50 L27 56.5 H18 L23 50 Z" fill="#fffaf0" stroke="#1b1b1b" stroke-width="1.6"/>
  </g>
</svg>
