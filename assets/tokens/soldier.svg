<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100">
  <!-- Drawn in the Blue team colours (#5b9bf0, #2f6fd6, #173763); the game recolours them for Red. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#d9a441"/><stop offset="1" stop-color="#7a5318"/>
    </linearGradient>
    <radialGradient id="field" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#5b9bf0"/><stop offset=".6" stop-color="#2f6fd6"/><stop offset="1" stop-color="#173763"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#dfe5ea"/><stop offset=".5" stop-color="#aab4bf"/><stop offset="1" stop-color="#8b96a2"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#d9cba6"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48.5" fill="#2e210c"/>
  <circle cx="50" cy="50" r="47" fill="url(#rim)"/>
  <circle cx="50" cy="50" r="40" fill="#2e210c"/>
  <circle cx="50" cy="50" r="38.5" fill="url(#field)"/>
  <path d="M19 45 A32 32 0 0 1 60 20" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
  <!-- sword behind the shield -->
  <g transform="rotate(42 50 50)" stroke="#1b1b1b" stroke-width="1.6" stroke-linejoin="round">
    <path d="M50 9 L54.5 17 V66 H45.5 V17 Z" fill="url(#steel)"/>
    <rect x="37" y="66" width="26" height="5.5" rx="2.5" fill="#e0b24a"/>
    <rect x="47.3" y="71.5" width="5.4" height="12" fill="#7a4a24"/>
    <circle cx="50" cy="86" r="4" fill="#e0b24a"/>
  </g>
  <!-- shield -->
  <path d="M50 27 C58 32 65 33.5 71 33.5 V52 C71 65 61 73 50 79 C39 73 29 65 29 52 V33.5 C35 33.5 42 32 50 27 Z"
        fill="url(#cream)" stroke="#1b1b1b" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M50 35 V71 M36 48 H64" stroke="#2f6fd6" stroke-width="6.5" stroke-linecap="round"/>
</svg>
